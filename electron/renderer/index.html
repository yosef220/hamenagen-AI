<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https: cover:; media-src 'self' file: blob: https:; connect-src 'self' https:; worker-src 'self' blob:"
  />
  <title>המנגן</title>
  <link rel="stylesheet" href="vendor/fonts.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div class="app" id="app">
    <!-- Navigation rail (right side in RTL) -->
    <nav class="rail" aria-label="ניווט ראשי">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">מ</span>
        <span class="brand-name">המנגן</span>
      </div>
      <ul class="nav" role="list">
        <li><button class="nav-item" data-view="home" type="button"><svg class="icon"><use href="vendor/icons.svg#house"></use></svg><span>בית</span></button></li>
        <li><button class="nav-item" data-view="library" type="button"><svg class="icon"><use href="vendor/icons.svg#library-big"></use></svg><span>ספרייה</span></button></li>
        <li><button class="nav-item" data-view="playlists" type="button"><svg class="icon"><use href="vendor/icons.svg#list-music"></use></svg><span>רשימות</span></button></li>
        <li><button class="nav-item" data-view="topics" type="button"><svg class="icon"><use href="vendor/icons.svg#shapes"></use></svg><span>נושאים</span></button></li>
        <li><button class="nav-item" data-view="radio" type="button"><svg class="icon"><use href="vendor/icons.svg#radio"></use></svg><span>רדיו</span><span class="nav-live" id="nav-live" hidden>חי</span></button></li>
        <li><button class="nav-item" data-view="downloads" type="button"><svg class="icon"><use href="vendor/icons.svg#download"></use></svg><span>הורדות</span><span class="nav-count" id="nav-downloads" hidden></span></button></li>
        <li><button class="nav-item" data-view="settings" type="button"><svg class="icon"><use href="vendor/icons.svg#settings"></use></svg><span>הגדרות</span></button></li>
      </ul>
      <div class="rail-status" id="rail-status" aria-live="polite">
        <div class="rail-count" id="rail-count"></div>
        <div class="rail-scan" id="rail-scan"></div>
        <div class="rail-model" id="rail-model"></div>
        <div class="rail-model" id="rail-vocal"></div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main" id="main" tabindex="-1">
      <div class="update-bar" id="update-bar" hidden>
        <svg class="icon"><use href="vendor/icons.svg#circle-alert"></use></svg>
        <span id="update-text"></span>
        <button class="btn btn-quiet" id="update-download" type="button">להורדה</button>
        <button class="icon-btn" id="update-dismiss" type="button" aria-label="סגירה"><svg class="icon"><use href="vendor/icons.svg#x"></use></svg></button>
      </div>

      <section class="view" id="view-home" data-view="home" aria-label="בית"></section>
      <section class="view" id="view-results" data-view="results" aria-label="תוצאות" hidden></section>
      <section class="view" id="view-library" data-view="library" aria-label="ספרייה" hidden></section>
      <section class="view" id="view-playlists" data-view="playlists" aria-label="רשימות" hidden></section>
      <section class="view" id="view-topics" data-view="topics" aria-label="נושאים" hidden></section>
      <section class="view" id="view-radio" data-view="radio" aria-label="רדיו" hidden></section>
      <section class="view" id="view-downloads" data-view="downloads" aria-label="הורדות" hidden></section>
      <section class="view" id="view-settings" data-view="settings" aria-label="הגדרות" hidden></section>
      <section class="view view-websearch" id="view-websearch" data-view="websearch" aria-label="חיפוש בגוגל" hidden></section>
    </main>

    <!-- Queue and lyrics drawer (left side in RTL) -->
    <aside class="drawer" id="drawer" aria-label="התור והמילים" hidden>
      <header class="drawer-head">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" data-tab="queue" type="button">התור</button>
          <button class="tab" role="tab" data-tab="lyrics" type="button">מילים</button>
        </div>
        <button class="icon-btn" id="drawer-close" type="button" aria-label="סגירה"><svg class="icon"><use href="vendor/icons.svg#x"></use></svg></button>
      </header>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <!-- The player dock -->
    <footer class="dock" id="dock" aria-label="נגן">
      <div class="dock-now">
        <div class="cover cover-sm" id="dock-cover" aria-hidden="true"></div>
        <div class="dock-meta">
          <div class="dock-title" id="dock-title">שום דבר לא מתנגן</div>
          <div class="dock-sub" id="dock-sub">בחרו שיר, נושא או ערוץ</div>
        </div>
        <button class="icon-btn heart" id="dock-heart" type="button" aria-label="סימון בלב" aria-pressed="false" disabled>
          <svg class="icon"><use href="vendor/icons.svg#heart"></use></svg>
        </button>
      </div>

      <div class="dock-center">
        <div class="transport">
          <button class="icon-btn" id="btn-shuffle" type="button" aria-label="ערבוב" aria-pressed="false"><svg class="icon"><use href="vendor/icons.svg#shuffle"></use></svg></button>
          <button class="icon-btn" id="btn-prev" type="button" aria-label="השיר הקודם"><svg class="icon"><use href="vendor/icons.svg#skip-back"></use></svg></button>
          <button class="play-btn" id="btn-play" type="button" aria-label="נגן"><svg class="icon"><use href="vendor/icons.svg#play"></use></svg></button>
          <button class="icon-btn" id="btn-next" type="button" aria-label="השיר הבא"><svg class="icon"><use href="vendor/icons.svg#skip-forward"></use></svg></button>
          <button class="icon-btn" id="btn-repeat" type="button" aria-label="חזרה" aria-pressed="false"><svg class="icon"><use href="vendor/icons.svg#repeat"></use></svg></button>
        </div>
        <div class="progress" id="progress">
          <span class="time" id="time-cur">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="מיקום בשיר" />
          <span class="time" id="time-dur">0:00</span>
        </div>
        <div class="live-line" id="live-line" hidden><span class="live-dot"></span><span>שידור חי</span></div>
      </div>

      <div class="dock-tools">
        <button class="icon-btn tool" id="btn-sleep" type="button" aria-label="טיימר שינה" aria-haspopup="menu">
          <svg class="icon"><use href="vendor/icons.svg#moon"></use></svg><span class="tool-label" id="sleep-label"></span>
        </button>
        <button class="icon-btn" id="btn-lyrics" type="button" aria-label="מילים"><svg class="icon"><use href="vendor/icons.svg#scroll-text"></use></svg></button>
        <button class="icon-btn" id="btn-queue" type="button" aria-label="התור"><svg class="icon"><use href="vendor/icons.svg#list-music"></use></svg></button>
        <div class="volume">
          <button class="icon-btn" id="btn-mute" type="button" aria-label="השתקה"><svg class="icon"><use href="vendor/icons.svg#volume-2"></use></svg></button>
          <input type="range" id="volume" min="0" max="100" value="90" aria-label="עוצמה" />
        </div>
      </div>
    </footer>

    <div class="menu" id="sleep-menu" role="menu" hidden>
      <div class="menu-title">לעצור את הנגינה</div>
      <button role="menuitem" type="button" data-sleep="15">בעוד רבע שעה</button>
      <button role="menuitem" type="button" data-sleep="30">בעוד חצי שעה</button>
      <button role="menuitem" type="button" data-sleep="45">בעוד שלושת רבעי שעה</button>
      <button role="menuitem" type="button" data-sleep="60">בעוד שעה</button>
      <button role="menuitem" type="button" data-sleep="track">בסוף השיר הזה</button>
      <button role="menuitem" type="button" data-sleep="off" class="menu-off">בלי טיימר</button>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="fatal" id="fatal" hidden>
      <div class="fatal-box">
        <h1>הליבה של המנגן לא עלתה</h1>
        <p id="fatal-text">משהו עצר את מנוע ההבנה של התוכנה. אפשר לנסות שוב; אם זה חוזר, הפרטים למטה יעזרו לתקן.</p>
        <pre id="fatal-details"></pre>
        <div class="fatal-actions">
          <button class="btn btn-primary" id="fatal-retry" type="button">לנסות שוב</button>
          <button class="btn btn-quiet" id="fatal-folder" type="button">לפתוח את תיקיית הנתונים</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script src="build-info.js"></script>
  <script src="vendor/hls.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/results.js"></script>
  <script src="js/views/library.js"></script>
  <script src="js/views/topics.js"></script>
  <script src="js/views/playlists.js"></script>
  <script src="js/views/radio.js"></script>
  <script src="js/views/downloads.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/websearch.js"></script>
  <script src="js/shabbat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
