<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    המנגן — app icon. The velvet of a Torah mantle with its embroidered gold
    band, and the letter מ in Frank Ruhl Libre. Rendered to PNG/ICO by
    scripts/make-icons.js (the font is embedded there).
  -->
  <defs>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="196"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="40" y="40" width="944" height="944" fill="#16365F"/>
    <rect x="40" y="806" width="944" height="30" fill="#D8B25E"/>
    <rect x="40" y="854" width="944" height="12" fill="#D8B25E"/>
  </g>
  <text x="512" y="668" text-anchor="middle" font-family="Frank Ruhl Libre" font-weight="700"
        font-size="930" fill="#D8B25E">מ</text>
</svg>
