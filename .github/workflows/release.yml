name: בדיקה, בנייה ושחרור

# Every pull request to main: core tests + an interface smoke test (the real
# app driven against a demo library) + the four Windows editions, each one
# file, with the app split into parts for the smart update.
# A tag v* — or a manual run with "release" ticked, which creates the tag from
# package.json — additionally publishes them as the latest GitHub release, with
# Hebrew notes and update.json, and points 0.1 installs at the new version.

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'לפרסם גרסה: התגית v<גרסה> נוצרת לפי package.json'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: בדיקות — ליבה וממשק
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Core tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest mutagen rapidfuzz numpy soundfile
          cd backend && python -m pytest -q

      - name: Install npm packages
        run: npm ci

      - name: Check every script parses
        run: for f in electron/*.js electron/renderer/js/*.js electron/renderer/js/views/*.js electron-builder.config.js scripts/parts.js scripts/copy-vendor.js; do node --check "$f"; done

      - name: Interface smoke test (real app, real core, demo library)
        run: |
          npx playwright install-deps chromium
          python tests/ui/make_library.py "$RUNNER_TEMP/music"
          xvfb-run -a -s "-screen 0 1600x1000x24" node tests/ui/shoot.js "$RUNNER_TEMP/music" "$RUNNER_TEMP/shots" --themes=light,dark

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  build:
    name: Windows — ${{ matrix.edition }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [portable, offline, setup, setup-offline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} does not match package.json version $ver" }

      - name: Install npm packages
        run: npm ci

      - name: Embedded Python with the core's libraries
        run: npm run prepare:win-python

      - name: The vocal-detection model (every edition)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: build/win-python/python.exe backend/scripts/prepare_audio_model.py --out build/audio-models

      - name: ffmpeg for MP3 downloads with the cover inside (every edition)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An LGPL build of the newest release branch (its version changes only
          # with a point release, so the smart update rarely sends it again);
          # only ffmpeg.exe is kept (yt-dlp needs neither ffprobe nor ffplay).
          $names = gh api repos/BtbN/FFmpeg-Builds/releases/latest --jq '.assets[].name' 2>$null
          $branch = $names | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-lgpl-[\d.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+)-.*$', '$1') } | Select-Object -Last 1
          $asset = if ($branch) { $branch } else { 'ffmpeg-master-latest-win64-lgpl.zip' }
          "ffmpeg build: $asset"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$asset"
          curl.exe -L --fail --retry 5 --retry-delay 10 -o ffmpeg.zip $url
          if ($LASTEXITCODE -ne 0 -or (Get-Item ffmpeg.zip).Length -lt 10MB) { throw "ffmpeg could not be downloaded" }
          7z x ffmpeg.zip -offmpeg_tmp | Out-Null
          New-Item -ItemType Directory -Force build/ffmpeg | Out-Null
          $exe = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName build/ffmpeg/ffmpeg.exe
          $license = Get-ChildItem -Recurse -Path ffmpeg_tmp -Filter 'LICENSE*' | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName build/ffmpeg/LICENSE.txt }
          "ffmpeg (LGPL build by BtbN/FFmpeg-Builds): https://github.com/BtbN/FFmpeg-Builds — source: https://ffmpeg.org/download.html" |
            Set-Content -Encoding utf8 build/ffmpeg/README.txt
          $versionLine = & build/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1
          $versionLine
          $versionLine | Set-Content -Encoding utf8 build/ffmpeg/VERSION.txt
          "{0:N1} MB" -f ((Get-Item build/ffmpeg/ffmpeg.exe).Length / 1MB)

      - name: Stamp the build
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "window.__BUILD__ = " + (@{ version = $ver; build = $sha; edition = '${{ matrix.edition }}' } | ConvertTo-Json -Compress) + ";" |
            Set-Content -Encoding utf8 electron/renderer/build-info.js

      - name: Put the AI model inside the app (offline editions)
        if: matrix.edition == 'offline' || matrix.edition == 'setup-offline'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: build/win-python/python.exe backend/scripts/prepare_model.py --out build/models

      - name: Package
        env:
          HAMENAGEN_EDITION: ${{ matrix.edition }}
        run: npx electron-builder --win --publish never --config electron-builder.config.js

      - name: Check the packaged core answers
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $res = "dist/win-unpacked/resources"
          foreach ($p in @("$res/python/python.exe", "$res/backend/hamenagen/rpc.py", "$res/backend/hamenagen/data/radio_seed.json",
                           "$res/backend/hamenagen/data/song_index.json", "$res/backend/hamenagen/data/topic_lexicon.json",
                           "$res/audio-models/ced-tiny/model.int8.onnx", "dist/win-unpacked/Hamenagen.exe")) {
            if (-not (Test-Path $p)) { throw "missing from the package: $p" }
          }
          $env:HAMENAGEN_BACKEND_DIR = (Resolve-Path "$res/backend").Path
          $env:HAMENAGEN_DATA_DIR = Join-Path $env:RUNNER_TEMP "hm-data"
          $requests = Join-Path $env:RUNNER_TEMP "requests.jsonl"
          @(
            '{"id":1,"method":"ping"}',
            '{"id":2,"method":"today"}',
            '{"id":3,"method":"handle_request","params":{"text":"שעה של שירי שבת"}}'
          ) | Set-Content -Encoding ascii $requests
          $boot = "import os, sys; sys.path.insert(0, os.environ['HAMENAGEN_BACKEND_DIR']); from hamenagen.rpc import main; main()"
          $out = Get-Content $requests | & "$res/python/python.exe" -c $boot
          $out | ForEach-Object { if ($_.Length -gt 300) { $_.Substring(0, 300) } else { $_ } } | Write-Host
          if (-not ($out -match '"pong": true')) { throw "the packaged core did not answer" }
          if (-not ($out -match '"id": 3, "ok": true')) { throw "the packaged core failed a request" }

      - name: Check the knowledge index and the vocal detector in the package
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $res = "dist/win-unpacked/resources"
          $env:HAMENAGEN_BACKEND_DIR = (Resolve-Path "$res/backend").Path
          $env:AUDIO_MODELS = (Resolve-Path "$res/audio-models").Path
          # A known piyut (מעוז צור → חנוכה) and a descriptive title (נרות דולקים → חנוכה), Hebrew as escapes.
          & "$res/python/python.exe" -c "import os, sys; sys.path.insert(0, os.environ['HAMENAGEN_BACKEND_DIR']); from hamenagen.knowledge import SongIndex, TopicLexicon; h = SongIndex.load().lookup('\u05de\u05e2\u05d5\u05d6 \u05e6\u05d5\u05e8'); print('index:', h); assert h and h.topics[0] == '\u05d7\u05e0\u05d5\u05db\u05d4'; r = TopicLexicon.load().classify('\u05e0\u05e8\u05d5\u05ea \u05d3\u05d5\u05dc\u05e7\u05d9\u05dd'); print('lexicon:', r); assert r.topic == '\u05d7\u05e0\u05d5\u05db\u05d4'"
          if ($LASTEXITCODE -ne 0) { throw "the knowledge index does not work in the package" }
          # Listen to a 50-second tone: three windows decoded by soundfile and tagged by the model.
          & "$res/python/python.exe" -c "import os, sys, wave, struct, math; sys.path.insert(0, os.environ['HAMENAGEN_BACKEND_DIR']); from hamenagen.vocal import VocalDetector; d = VocalDetector([os.environ['AUDIO_MODELS']]); assert d.available(), d.status(); p = os.path.join(os.environ['RUNNER_TEMP'], 'tone.wav'); w = wave.open(p, 'wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(22050); w.writeframes(b''.join(struct.pack('<h', int(8000 * math.sin(2 * math.pi * 440 * i / 22050))) for i in range(22050 * 50))); w.close(); r = d.analyze(p); print('vocal check:', r.verdict, [x.as_list() for x in r.windows], r.error); assert r.verdict in ('instruments', 'maybe', 'vocal') and len(r.windows) == 3"
          if ($LASTEXITCODE -ne 0) { throw "the vocal detector does not work in the package" }

      - name: Check the download engine in the package (yt-dlp process, truststore, ffmpeg)
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $res = "dist/win-unpacked/resources"
          if (-not (Test-Path "$res/ffmpeg/ffmpeg.exe")) { throw "ffmpeg is missing from the package" }
          $env:PYTHONPATH = (Resolve-Path "$res/backend").Path
          # The engine process starts, with yt-dlp and the Windows certificate store (no network needed).
          $ver = & "$res/python/python.exe" -m hamenagen.ytdlp_child --version
          if ($LASTEXITCODE -ne 0 -or -not $ver) { throw "the yt-dlp process does not start" }
          "yt-dlp $ver"
          & "$res/python/python.exe" -c "import truststore, sys; sys.path.insert(0, r'$res/backend'); from hamenagen.fetcher import find_ffmpeg; f = find_ffmpeg(r'$res/ffmpeg'); print('ffmpeg:', f); assert f.endswith('ffmpeg.exe')"
          if ($LASTEXITCODE -ne 0) { throw "the packaged core cannot find ffmpeg or truststore" }
          & "$res/ffmpeg/ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Check the bundled model works with no network (offline editions)
        if: matrix.edition == 'offline' || matrix.edition == 'setup-offline'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          HF_HUB_OFFLINE: '1'
        run: |
          $res = "dist/win-unpacked/resources"
          $env:HAMENAGEN_BACKEND_DIR = (Resolve-Path "$res/backend").Path
          $env:MODELS = (Resolve-Path "$res/models").Path
          & "$res/python/python.exe" -c "import os, sys; sys.path.insert(0, os.environ['HAMENAGEN_BACKEND_DIR']); from hamenagen.classifier import EmbeddingBackend; b = EmbeddingBackend(cache_dir=os.environ['MODELS'], allow_download=False); assert b.load(), b.load_error; c = b.classify('\u05e1\u05d5\u05e4\u05d2\u05e0\u05d9\u05d5\u05ea \u05d7\u05de\u05d5\u05ea'); print('model ok:', c); assert c is not None and c.topic == '\u05d7\u05e0\u05d5\u05db\u05d4'"

      - name: The parts of the app, for the smart update
        shell: pwsh
        run: |
          if (-not (Test-Path dist/win-unpacked/resources/parts.json)) { throw "resources/parts.json is missing (scripts/parts.js)" }
          build/win-python/python.exe scripts/make_parts.py dist/win-unpacked dist/parts
          if ($LASTEXITCODE -ne 0) { throw "the parts could not be made" }
          Get-ChildItem dist/parts | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: The smart update's swap works on Windows (and puts everything back if it fails)
        if: matrix.edition == 'portable'
        shell: pwsh
        run: |
          # A Hebrew folder name, like a Windows user name in Hebrew.
          $t = Join-Path $env:RUNNER_TEMP 'בדיקת-עדכון'
          $inst = Join-Path $t 'inst'
          $work = Join-Path $t 'work'
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item dist/win-unpacked $inst -Recurse
          function Stage([string]$marker) {
            Remove-Item (Join-Path $work 'staging') -Recurse -Force -ErrorAction SilentlyContinue
            $stage = Join-Path $work 'staging\backend\backend'
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item (Join-Path $inst 'resources\backend\*') $stage -Recurse
            Set-Content (Join-Path $stage $marker) 'yes'
            Copy-Item (Join-Path $inst 'resources\parts.json') (Join-Path $work 'parts.json')
            $plan = @{ version = '9.9.9'; root = $inst; resources = (Join-Path $inst 'resources'); work = $work
                       result = (Join-Path $work 'result.json'); parts_json = (Join-Path $work 'parts.json')
                       parts = @(@{ name = 'backend'; kind = 'dir'; staging = (Join-Path $work 'staging\backend'); old = @('backend'); new = @('backend') }) }
            [IO.File]::WriteAllText((Join-Path $work 'plan.json'), ($plan | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding $false))
          }
          Stage 'FIRST.txt'
          powershell -NoProfile -ExecutionPolicy Bypass -File electron/update-apply.ps1 -Plan (Join-Path $work 'plan.json')
          $r = Get-Content (Join-Path $work 'result.json') -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "the swap failed: $($r.error)" }
          if (-not (Test-Path (Join-Path $inst 'resources\backend\FIRST.txt'))) { throw "the new part is not in place" }
          "swap: ok"
          Stage 'SECOND.txt'
          powershell -NoProfile -ExecutionPolicy Bypass -File electron/update-apply.ps1 -Plan (Join-Path $work 'plan.json') -FailAfter 2
          $r = Get-Content (Join-Path $work 'result.json') -Raw | ConvertFrom-Json
          if ($r.ok) { throw "a failing swap reported success" }
          if (Test-Path (Join-Path $inst 'resources\backend\SECOND.txt')) { throw "the failed swap was not undone" }
          if (-not (Test-Path (Join-Path $inst 'resources\backend\FIRST.txt'))) { throw "the old part did not come back" }
          "rollback: ok ($($r.error))"
          Get-Content (Join-Path $work 'apply.log')

      - name: NSIS, for the one-file portable editions
        if: matrix.edition == 'portable' || matrix.edition == 'offline'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress | Out-Null }
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { throw "NSIS was not installed" }

      - name: One file for the portable editions (opens itself into a folder)
        if: matrix.edition == 'portable' || matrix.edition == 'offline'
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = if ('${{ matrix.edition }}' -eq 'offline') { "Hamenagen-$ver-Portable-Offline.exe" } else { "Hamenagen-$ver-Portable.exe" }
          $label = if ('${{ matrix.edition }}' -eq 'offline') { 'גרסה ניידת עם המודל' } else { 'גרסה ניידת' }
          $src = (Resolve-Path dist/win-unpacked).Path
          $out = Join-Path (Resolve-Path dist).Path $name
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /NOCD /V2 "/DVERSION=$ver" "/DSRCDIR=$src" "/DOUTFILE=$out" "/DICON=$((Resolve-Path assets/icon.ico).Path)" "/DLABEL=$label" scripts/portable.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          # Open it silently into a folder and check the player is there, whole.
          $dest = Join-Path $env:RUNNER_TEMP 'portable-test'
          Start-Process -FilePath $out -ArgumentList '/S', "/D=$dest" -Wait
          foreach ($p in @('Hamenagen.exe', 'resources\app.asar', 'resources\parts.json', 'resources\python\python.exe')) {
            if (-not (Test-Path (Join-Path $dest $p))) { throw "the portable EXE did not open $p" }
          }
          "{0}: {1:N0} MB" -f $name, ((Get-Item $out).Length / 1MB)

      - name: Each file also in a ZIP of its own (network filters cut large .exe downloads)
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Filter 'Hamenagen-*.exe' | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath ($_.FullName -replace '\.exe$', '.zip') -Force
          }

      - name: List the files
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - uses: actions/upload-artifact@v4
        with:
          name: hamenagen-${{ matrix.edition }}
          path: |
            dist/Hamenagen-*.zip
            dist/Hamenagen-*.exe
            dist/parts/*
          if-no-files-found: error

  release:
    name: שחרור גרסה
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: The version to publish
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes and update manifests
        run: python3 scripts/release_notes.py "${{ steps.version.outputs.tag }}" "${{ github.repository }}" dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: המנגן ${{ steps.version.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          make_latest: 'true'
          files: |
            dist/Hamenagen-*.zip
            dist/Hamenagen-*.exe
            dist/parts/hamenagen-part-*.zip
            dist/update.json

      - name: Tell 0.1 installs about the new version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: portable-latest
          name: המנגן 0.1 (גרסה ישנה)
          prerelease: true
          make_latest: 'false'
          body: |
            זו גרסת הבדיקה הישנה (0.1). הגרסה החדשה: https://github.com/${{ github.repository }}/releases/latest
          files: dist/legacy/update.json
