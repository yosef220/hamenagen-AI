[project]
name = "hamenagen"
version = "1.0.0"
description = "Smart Community Music Player — offline-first core (Hebrew NLP, fuzzy matching, Hebrew calendar)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
tags = ["mutagen>=1.47"]
fuzzy = ["rapidfuzz>=3.6"]
online = ["yt-dlp>=2024.1.0"]
embeddings = ["fastembed>=0.3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
hamenagen = "hamenagen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hamenagen"]
